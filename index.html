<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ethan 的私房地圖</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* 視覺系統核心：CSS 變數 (Design Tokens) */
        /* 復古設計系統 (retro-design-system) token */
        :root {
            --bg-color: #ffffff;           /* 純白畫布 */
            --surface-color: #ffffff;      /* 純白卡片底色 */
            --text-main: #000000;          /* 純黑標題主字體 */
            --text-secondary: #4B5563;     /* 次要文字 */
            --body: #374151;               /* 內文 */
            --ink: #000000;                /* 招牌黑色粗邊框 */

            --brand: #BAD4FF;              /* 暖桃主色 */
            --brand-medium: #C9DBFF;
            --brand-soft: #D5E3FF;
            --brand-softer: #E8F0FF;
            --brand-strong: #8AAAD4;
            --link: #3A5DA0;               /* 連結藍（達 WCAG AA） */
            --hover-bg: #F9FAFB;           /* 卡片 hover 底色 */

            --radius-card: 6px;            /* 復古小圓角，全站統一方角 */
            --radius-ui: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Open Sans", 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            position: relative;
        }

        /* ── 側邊欄與毛玻璃效果 (Desktop) ── */
        #sidebar {
            width: 420px;
            height: 100%;
            background: var(--surface-color);
            box-shadow: none;
            display: block;
            overflow-y: auto;
            z-index: 1000;
            border-right: 1px solid var(--ink);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
        }

        .header {
            padding: 32px 24px 12px 24px;
            background: transparent;
            z-index: 10;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        /* ── 搜尋框 ── */
        .search-box {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid var(--ink);
            border-radius: var(--radius-ui);
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 16px;
            outline: none;
            color: var(--text-main);
            background-color: var(--surface-color);
            transition: box-shadow 0.2s ease;
            appearance: none;
        }
        .search-box:focus {
            border-color: var(--ink);
            box-shadow: 0 0 0 4px var(--brand-medium);
        }
        .search-box::placeholder { color: var(--text-secondary); font-weight: 400; }

        /* ── 橫向滑動列 ── */
        .filter-group {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: none;
        }
        .filter-group::-webkit-scrollbar { display: none; }

        /* ── 按鈕系統 (Pill Buttons) ── */
        .filter-btn {
            padding: 12px 18px;
            border: 1px solid var(--ink);
            background: var(--surface-color);
            border-radius: var(--radius-ui);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s ease, color 0.15s ease;
        }
        /* hover：淺桃回饋；active：暖桃實心，兩者分離讓選中狀態明確 */
        .filter-btn:hover {
            background: var(--brand-soft);
        }
        .filter-btn.active {
            background: var(--brand);
            color: var(--text-main);
            border-color: var(--ink);
        }

        /* 分類列改為自動換行，10+ 個分類全部露出，不再隱藏於橫向捲動 */
        #category-filters {
            flex-wrap: wrap;
            overflow-x: visible;
        }

        /* 標籤區：預設收起，點按鈕才展開；用 display 切換，穩定可靠 */
        #tag-filters {
            flex-wrap: wrap;
            overflow: visible;
            margin-bottom: 12px;
            padding-bottom: 4px;
        }
        #tag-filters.hidden { display: none; }

        .tag-toggle {
            display: inline-block;
            margin-bottom: 12px;
            padding: 10px 16px;
            background: var(--surface-color);
            border: 1px solid var(--ink);
            border-radius: var(--radius-ui);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .tag-toggle:hover { background: var(--brand-soft); }

        /* Phosphor icon 對齊（取代原本的 emoji） */
        .ph { vertical-align: -2px; margin-right: 5px; }
        
        .tag-btn {
            padding: 7px 13px;
            background: var(--surface-color);
            border: 1px solid var(--ink);
            border-radius: var(--radius-ui);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .tag-btn:hover { background: var(--brand-softer); }
        .tag-btn.active {
            background: var(--brand);
            color: var(--text-main);
        }

        /* ── 列表與卡片區域 ── */
        #place-list {
            padding: 0 24px 24px 24px;
        }

        .place-card {
            background: var(--surface-color);
            border-radius: var(--radius-card);
            padding: 20px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: background 0.15s ease;
            border: 1px solid var(--ink);
        }
        .place-card:hover {
            background: var(--hover-bg);
        }
        .place-card:active { background: var(--brand-softer); }

        .place-name { font-size: 18px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.2px; color: var(--text-main); }
        .place-meta { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; font-weight: 600; }
        .place-note { font-size: 14px; color: var(--body); margin-bottom: 16px; line-height: 1.6; }

        .tag {
            display: inline-block;
            background: var(--brand-softer);
            padding: 5px 9px;
            border: 1px solid var(--ink);
            border-radius: var(--radius-ui);
            font-size: 12px;
            margin-right: 6px;
            margin-bottom: 6px;
            color: var(--text-main);
            font-weight: 600;
        }

        /* ── 地圖與彈窗區域 ── */
        #map { flex: 1; height: 100%; z-index: 500; background: #EEF4FF; }
        /* 圖磚調暖，貼合桃色復古調 */
        .leaflet-tile { filter: saturate(1.02) contrast(0.98) brightness(1.03) hue-rotate(-6deg); }

        /* 定位「我的位置」按鈕 */
        #locate-btn {
            position: absolute;
            right: 16px;
            bottom: 32px;
            z-index: 600;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-color);
            border: 1px solid var(--ink);
            border-radius: var(--radius-ui);
            font-size: 20px;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.15s ease;
        }
        #locate-btn:hover { background: var(--brand-soft); }
        #locate-btn .ph { margin-right: 0; }
        #locate-btn.locating { background: var(--brand); }

        .leaflet-popup-content-wrapper {
            border-radius: var(--radius-ui);
            padding: 14px;
            box-shadow: none;
            border: 1px solid var(--ink);
        }
        .leaflet-popup-tip { box-shadow: none; }
        .popup-title { font-weight: 700; font-size: 16px; margin-bottom: 8px; color: var(--text-main); }
        .popup-link {
            display: inline-block;
            margin-top: 12px;
            color: var(--link);
            text-decoration: underline;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s ease;
        }
        .popup-link:hover { color: #2c4372; }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 15px; font-weight: 600; color: var(--text-main); z-index: 2000;
            background: var(--surface-color); padding: 16px 28px; border-radius: var(--radius-ui);
            border: 1px solid var(--ink); box-shadow: none;
        }

        /* 定位按鈕 */
        #locate-btn {
            position: absolute;
            right: 16px;
            bottom: 24px;
            z-index: 1500;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-color);
            border: 1px solid var(--ink);
            border-radius: var(--radius-ui);
            color: var(--text-main);
            font-size: 22px;
            cursor: pointer;
            box-shadow: none;
            transition: background 0.15s ease;
        }
        #locate-btn:hover { background: var(--brand-soft); }
        #locate-btn.locating { background: var(--brand); }
        #locate-btn .ph { margin-right: 0; }

        /* 隨機抽籤按鈕專屬樣式 */
        /* 隨機按鈕：中性黑實心，維持全頁單一藍強調色 */
        .random-btn {
            background: var(--ink);
            color: #ffffff;
            border: 1px solid var(--ink);
            box-shadow: none;
        }
        .random-btn:hover {
            background: #2b2b2b;
            color: #ffffff;
            border-color: var(--ink);
        }

        /* ── RWD 手機版全螢幕沉浸體驗 ── */
        .mobile-toggle { display: none; }

        @media (max-width: 768px) {
            body { display: block; }
            
            #sidebar {
                position: absolute;
                top: 0; left: 0;
                width: 100% !important;
                height: 100%;
                background: var(--surface-color);
                border-right: none;
            }

            /* 確保列表底部有足夠空間，不被懸浮按鈕遮擋 */
            #place-list { padding-bottom: 120px; }

            #map {
                position: absolute;
                top: 0; left: 0;
                width: 100% !important;
                height: 100%;
            }

            body.show-map #sidebar {
                transform: translateY(100%);
                opacity: 0;
                pointer-events: none;
            }

            /* 手機專屬懸浮按鈕 */
            .mobile-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
                position: fixed;
                bottom: 40px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 2000;
                background: #000000; /* 實心黑，扁平復古 */
                color: white;
                border: 1px solid #000000;
                padding: 16px 32px;
                border-radius: var(--radius-ui);
                font-size: 15px;
                font-weight: 600;
                box-shadow: none;
                cursor: pointer;
                transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1), background 0.3s ease;
            }
            .mobile-toggle:active { transform: translateX(-50%) scale(0.92); }

            /* 手機清單畫面時不顯示定位鈕，切到地圖才出現 */
            #locate-btn { display: none; }
            body.show-map #locate-btn { display: flex; bottom: 110px; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <h1>My Map Space</h1>
            <input type="text" id="search-input" class="search-box" placeholder="搜尋店名、區域或標籤...">
            <div class="filter-group" id="category-filters">
                <button class="filter-btn active" onclick="filterCategory('all', this)">全部</button>
                <button class="filter-btn" onclick="filterCategory('restaurant', this)">餐廳</button>
                <button class="filter-btn" onclick="filterCategory('cafe', this)">咖啡廳</button>
                <button class="filter-btn" onclick="filterCategory('snack', this)">小吃</button>
                <button class="filter-btn" onclick="filterCategory('dessert', this)">甜點</button>
                <button class="filter-btn" onclick="filterCategory('beverage', this)">飲料</button>
                <button class="filter-btn" onclick="filterCategory('bar', this)">酒吧</button>
                <button class="filter-btn" onclick="filterCategory('spot', this)">景點</button>
                <button class="filter-btn" onclick="filterCategory('shop', this)">商店</button>
                <button class="filter-btn" onclick="filterCategory('hotel', this)">住宿</button>
                <button class="filter-btn random-btn" onclick="pickRandomPlace()"><i class="ph ph-dice-five"></i>隨機抽一家</button>
            </div>
            <button id="tag-toggle" class="tag-toggle" onclick="toggleTags()">篩選標籤 ▾</button>
            <div id="tag-filters" class="filter-group hidden"></div>
        </div>
        <div id="place-list"></div>
    </div>

    <div id="map"></div>
    <button id="locate-btn" onclick="locateUser()" title="定位我的位置" aria-label="定位我的位置"><i class="ph ph-crosshair"></i></button>
    <div id="loading">載入最新地圖資料中...</div>

    <button id="mobile-toggle-btn" class="mobile-toggle" onclick="toggleMobileView()"><i class="ph ph-map-trifold"></i>切換地圖</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        // 重要：請將下方的網址替換成你自己的 Google Sheets CSV 發布網址
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSu8Fd0IWRe8LJUGvxjUXgmw5_AlXGfdokhoEKb19cAp_mLMSWM06FKMLA0nv03DcJ0grV5VYOnTCYr/pub?output=csv";

        // 分類英文 → 中文對照表
        const CATEGORY_NAMES = {
            restaurant: '餐廳',
            cafe: '咖啡廳',
            snack: '小吃',
            dessert: '甜點',
            beverage: '飲料',
            bar: '酒吧',
            spot: '景點',
            shop: '商店',
            hotel: '住宿'
        };

        let myPlaces = [];
        let currentFilteredPlaces = []; // 新增這行：用來記住目前篩選出來的名單
        let currentCategory = 'all';
        let searchQuery = '';
        let currentActiveTag = null;
        let showingMap = false;
        
        const map = L.map('map', { zoomControl: false }).setView([25.04, 121.54], 12);
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap © CARTO',
            maxZoom: 19
        }).addTo(map);

        let markersGroup = L.layerGroup().addTo(map);

        // 定位使用者目前位置
        let userMarker = null, userCircle = null;
        function locateUser() {
            document.getElementById('locate-btn').classList.add('locating');
            // 手機在列表畫面時，先切到地圖才看得到定位結果
            if (window.innerWidth <= 768 && !showingMap) toggleMobileView();
            map.locate({ setView: true, maxZoom: 16, enableHighAccuracy: true });
        }
        map.on('locationfound', function(e) {
            document.getElementById('locate-btn').classList.remove('locating');
            if (userMarker) map.removeLayer(userMarker);
            if (userCircle) map.removeLayer(userCircle);
            userCircle = L.circle(e.latlng, {
                radius: e.accuracy, color: '#3A5DA0', weight: 1,
                fillColor: '#3A5DA0', fillOpacity: 0.12
            }).addTo(map);
            userMarker = L.circleMarker(e.latlng, {
                radius: 8, color: '#000000', weight: 2,
                fillColor: '#3A5DA0', fillOpacity: 1
            }).addTo(map).bindPopup('<div class="popup-title">你在這裡</div>').openPopup();
        });
        map.on('locationerror', function() {
            document.getElementById('locate-btn').classList.remove('locating');
            alert('無法取得你的位置，請確認瀏覽器已允許定位權限，並在 HTTPS（例如 GitHub Pages）環境下開啟。');
        });

        function toggleMobileView() {
            showingMap = !showingMap;
            const btn = document.getElementById('mobile-toggle-btn');
            if (showingMap) {
                document.body.classList.add('show-map');
                btn.innerHTML = '<i class="ph ph-list"></i>顯示列表';
                setTimeout(() => map.invalidateSize(), 300);
            } else {
                document.body.classList.remove('show-map');
                btn.innerHTML = '<i class="ph ph-map-trifold"></i>切換地圖';
            }
        }

        function loadData() {
            if(SHEET_CSV_URL.includes("請將你的")) {
                document.getElementById('loading').innerHTML = '<i class="ph ph-warning"></i>錯誤：尚未填寫 Google Sheets 網址';
                return;
            }

            Papa.parse(SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    const rawData = results.data;
                    let allTagsSet = new Set();
                    
                    rawData.forEach(row => {
                        if (row.latitude && row.longitude && row.name) {
                            let rawTags = row.tags ? row.tags.split(',').map(t => t.trim()).filter(t => t !== '') : [];
                            rawTags.forEach(t => allTagsSet.add(t));

                            myPlaces.push({
                                name: row.name,
                                category: row.category ? row.category.toLowerCase().trim() : 'other',
                                area: row.area || '',
                                tags: rawTags,
                                lat: parseFloat(row.latitude),
                                lng: parseFloat(row.longitude),
                                googleMapUrl: row.url || '',
                                note: row.note || ''
                            });
                        }
                    });

                    renderTagButtons(Array.from(allTagsSet));
                    document.getElementById('loading').style.display = 'none';
                    renderMapAndList();
                },
                error: function(error) {
                    document.getElementById('loading').innerText = "讀取資料失敗，請檢查網址與網路連線。";
                    console.error("PapaParse Error:", error);
                }
            });
        }

        function renderTagButtons(tags) {
            const container = document.getElementById('tag-filters');
            container.innerHTML = ''; 
            tags.sort().forEach(tag => {
                const btn = document.createElement('button');
                btn.className = 'tag-btn';
                btn.innerText = `#${tag}`;
                btn.onclick = () => toggleTagFilter(tag, btn);
                container.appendChild(btn);
            });
        }

        function toggleTags() {
            const container = document.getElementById('tag-filters');
            const btn = document.getElementById('tag-toggle');
            const isHidden = container.classList.toggle('hidden');
            btn.textContent = isHidden ? '篩選標籤 ▾' : '收合標籤 ▲';
        }

        function toggleTagFilter(tag, button) {
            if (currentActiveTag === tag) {
                currentActiveTag = null;
                button.classList.remove('active');
            } else {
                currentActiveTag = tag;
                document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
            }
            renderMapAndList();
        }

function renderMapAndList() {
            markersGroup.clearLayers();
            const listContainer = document.getElementById('place-list');
            listContainer.innerHTML = '';

            // 修正點：必須將結果存入「全域變數」 currentFilteredPlaces，讓地圖與抽籤功能都能同步抓到資料！
            currentFilteredPlaces = myPlaces.filter(place => {
                // 1. 判斷主分類
                const matchesCategory = currentCategory === 'all' || place.category === currentCategory;
                
                // 2. 多關鍵字搜尋邏輯
                // 先把英文 category 轉換成中文，以便搜尋
                const categoryForSearch = CATEGORY_NAMES[place.category] || place.category;
                // 將中文分類也加入搜尋字串中
                const searchString = `${place.name} ${place.note} ${place.area} ${categoryForSearch} ${place.tags.join(' ')}`.toLowerCase();
                const keywords = searchQuery.trim().split(/\s+/).filter(k => k !== '');
                const matchesSearch = keywords.length === 0 || keywords.every(kw => searchString.includes(kw));
                
                // 3. 判斷標籤
                const matchesTag = currentActiveTag === null || place.tags.includes(currentActiveTag);
                
                return matchesCategory && matchesSearch && matchesTag;
            });

            // 這裡使用 currentFilteredPlaces 來跑迴圈，地標就會回來了
            currentFilteredPlaces.forEach(place => {
                const marker = L.marker([place.lat, place.lng]);
                const popupContent = `
                    <div class="popup-title">${place.name}</div>
                    <div style="font-size:14px; color:#666; line-height:1.5;">${place.note || place.area}</div>
                    <a href="${place.googleMapUrl}" target="_blank" class="popup-link">在 Google Maps 中開啟 ↗</a>
                `;
                marker.bindPopup(popupContent);
                markersGroup.addLayer(marker);
                
                // 把 marker 存進 place 物件中，方便抽籤時可以直接打開彈窗
                place.marker = marker;

                const card = document.createElement('div');
                card.className = 'place-card';
                
                let tagsHtml = place.tags.map(tag => `<span class="tag">#${tag}</span>`).join('');
                let categoryName = CATEGORY_NAMES[place.category] || place.category;

                card.innerHTML = `
                    <div class="place-name">${place.name}</div>
                    <div class="place-meta">${place.area} ${place.area && categoryName && categoryName !== 'other' ? '·' : ''} ${categoryName !== 'other' ? categoryName : ''}</div>
                    ${place.note ? `<div class="place-note">${place.note}</div>` : ''}
                    <div>${tagsHtml}</div>
                `;

                card.addEventListener('click', () => {
                    if (window.innerWidth <= 768 && !showingMap) {
                        toggleMobileView();
                    }
                    map.flyTo([place.lat, place.lng], 16, { animate: true, duration: 1.2 });
                    setTimeout(() => marker.openPopup(), 400);
                });

                listContainer.appendChild(card);
            });
        }

        function filterCategory(category, button) {
            currentCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            renderMapAndList();
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderMapAndList();
        });
// 隨機抽籤功能
        function pickRandomPlace() {
            // 防呆機制：如果目前篩選條件下沒有店
            if (currentFilteredPlaces.length === 0) {
                alert("目前條件沒有找到店家喔！請換個標籤試試。");
                return;
            }

            // 1. 隨機抽取一家店
            const randomIndex = Math.floor(Math.random() * currentFilteredPlaces.length);
            const luckyPlace = currentFilteredPlaces[randomIndex];

            // 2. 如果是手機版且目前在列表畫面，自動切換到地圖
            if (window.innerWidth <= 768 && !showingMap) {
                toggleMobileView();
            }

            // 3. 畫面優雅地飛向目標定點
            map.flyTo([luckyPlace.lat, luckyPlace.lng], 16, { animate: true, duration: 1.5 });
            
            // 4. 等飛行時間結束後，打開彈窗並加上「驚喜提示」
            setTimeout(() => {
                luckyPlace.marker.setPopupContent(`
                    <div style="font-size:13px; color:#3A5DA0; font-weight:700; margin-bottom:6px;"><i class="ph ph-dice-five"></i>今晚就決定是你了！</div>
                    <div class="popup-title">${luckyPlace.name}</div>
                    <div style="font-size:14px; color:#666; line-height:1.5;">${luckyPlace.note || luckyPlace.area}</div>
                    <a href="${luckyPlace.googleMapUrl}" target="_blank" class="popup-link">在 Google Maps 中開啟 ↗</a>
                `);
                luckyPlace.marker.openPopup();
            }, 1500);
        }
        loadData();
    </script>
</body>
</html>
