<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ethan 的私房地圖</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* 🎨 視覺系統核心：CSS 變數 (Design Tokens) */
        :root {
            --bg-color: #f5f5f7;           /* 溫和冷灰底色 */
            --surface-color: #ffffff;      /* 純白卡片底色 */
            --text-main: #1d1d1f;          /* 沉穩深色主字體 */
            --text-secondary: #86868b;     /* 高質感淺灰次字體 */
            --accent-color: #0071e3;       /* 科技藍強調色 */
            --accent-hover: #0077ED;
            
            --radius-card: 16px;           /* 卡片大圓角 */
            --radius-ui: 12px;             /* 搜尋框/彈窗中圓角 */
            --radius-pill: 24px;           /* 藥丸按鈕全圓角 */
            
            --shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.04);     /* 卡片預設微陰影 */
            --shadow-hover: 0 12px 32px rgba(0, 0, 0, 0.08);   /* 懸浮立體陰影 */
            --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.15);    /* 懸浮按鈕重陰影 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            position: relative;
        }

        /* ── 側邊欄與毛玻璃效果 (Desktop) ── */
        #sidebar {
            width: 420px;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 1px 0 20px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            border-right: 1px solid rgba(0,0,0,0.04);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
        }

        .header {
            padding: 32px 24px 12px 24px;
            background: transparent;
            z-index: 10;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        /* ── 搜尋框 ── */
        .search-box {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d2d2d7;
            border-radius: var(--radius-ui);
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
            background-color: var(--surface-color);
            transition: all 0.3s ease;
            appearance: none;
        }
        .search-box:focus { 
            border-color: var(--accent-color); 
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.12);
        }
        .search-box::placeholder { color: #a1a1a6; }

        /* ── 橫向滑動列 ── */
        .filter-group {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: none;
        }
        .filter-group::-webkit-scrollbar { display: none; }

        /* ── 按鈕系統 (Pill Buttons) ── */
        .filter-btn {
            padding: 10px 18px;
            border: 1px solid #d2d2d7;
            background: var(--surface-color);
            border-radius: var(--radius-pill);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--text-main);
            color: var(--surface-color);
            border-color: var(--text-main);
        }

        #tag-filters { margin-bottom: 4px; padding-bottom: 12px; }
        
        .tag-btn {
            padding: 8px 14px;
            background: #f0f0f2;
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #495057;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .tag-btn:hover { background: #e8e8ed; }
        .tag-btn.active {
            background: var(--accent-color); 
            color: var(--surface-color);
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.25);
        }

        /* ── 列表與卡片區域 ── */
        #place-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px 24px 24px;
            -webkit-overflow-scrolling: touch;
        }

        .place-card {
            background: var(--surface-color);
            border-radius: var(--radius-card);
            padding: 22px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(0,0,0,0.02);
        }
        .place-card:hover { 
            transform: translateY(-4px); 
            box-shadow: var(--shadow-hover); 
        }
        .place-card:active { transform: scale(0.98); }

        .place-name { font-size: 18px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.3px; color: var(--text-main); }
        .place-meta { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; font-weight: 500;}
        .place-note { font-size: 14px; color: #495057; margin-bottom: 16px; line-height: 1.6; }
        
        .tag {
            display: inline-block;
            background: var(--bg-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-right: 6px;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* ── 地圖與彈窗區域 ── */
        #map { flex: 1; height: 100%; z-index: 500; }

        .leaflet-popup-content-wrapper { 
            border-radius: var(--radius-ui); 
            padding: 12px; 
            box-shadow: var(--shadow-hover); 
        }
        .popup-title { font-weight: 700; font-size: 16px; margin-bottom: 8px; color: var(--text-main); }
        .popup-link { 
            display: inline-block; 
            margin-top: 12px; 
            color: var(--accent-color); 
            text-decoration: none; 
            font-size: 14px; 
            font-weight: 500; 
            transition: color 0.2s ease;
        }
        .popup-link:hover { color: var(--accent-hover); }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 15px; font-weight: 500; color: var(--text-secondary); z-index: 2000;
            background: var(--surface-color); padding: 16px 28px; border-radius: var(--radius-pill); box-shadow: var(--shadow-hover);
        }

        /* 🎲 隨機抽籤按鈕專屬樣式 */
        .random-btn {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: var(--text-main);
            border: 1px solid #d2d2d7;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .random-btn:hover {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); /* 懸浮時會有淡淡的炫彩紫藍色 */
            color: #ffffff;
            border-color: transparent;
            transform: translateY(-2px);
        }

        /* 📱 ── RWD 手機版全螢幕沉浸體驗 ── */
        .mobile-toggle { display: none; }

        @media (max-width: 768px) {
            body { display: block; }
            
            #sidebar {
                position: absolute;
                top: 0; left: 0;
                width: 100% !important;
                height: 100%;
                background: rgba(245, 245, 247, 0.95);
            }

            /* 確保列表底部有足夠空間，不被懸浮按鈕遮擋 */
            #place-list { padding-bottom: 120px; }

            #map {
                position: absolute;
                top: 0; left: 0;
                width: 100% !important;
                height: 100%;
            }

            body.show-map #sidebar {
                transform: translateY(100%);
                opacity: 0;
                pointer-events: none;
            }

            /* 手機專屬懸浮按鈕 */
            .mobile-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
                position: fixed;
                bottom: 40px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 2000;
                background: rgba(29, 29, 31, 0.85); /* 黑色毛玻璃 */
                backdrop-filter: blur(15px);
                -webkit-backdrop-filter: blur(15px);
                color: white;
                border: none;
                padding: 16px 32px;
                border-radius: 30px;
                font-size: 15px;
                font-weight: 600;
                box-shadow: var(--shadow-float);
                cursor: pointer;
                transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1), background 0.3s ease;
            }
            .mobile-toggle:active { transform: translateX(-50%) scale(0.92); }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <h1>My Map Space</h1>
            <input type="text" id="search-input" class="search-box" placeholder="搜尋店名、區域或標籤...">
            <div class="filter-group">
                <button class="filter-btn active" onclick="filterCategory('all', this)">全部</button>
                <button class="filter-btn" onclick="filterCategory('restaurant', this)">餐廳</button>
                <button class="filter-btn" onclick="filterCategory('cafe', this)">咖啡廳</button>
                <button class="filter-btn random-btn" onclick="pickRandomPlace()">🎲 隨機抽一家</button>
            </div>
            <div id="tag-filters" class="filter-group"></div>
        </div>
        <div id="place-list"></div>
    </div>

    <div id="map"></div>
    <div id="loading">載入最新地圖資料中...</div>

    <button id="mobile-toggle-btn" class="mobile-toggle" onclick="toggleMobileView()">🗺️ 切換地圖</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        // 🚨 重要：請將下方的網址替換成你自己的 Google Sheets CSV 發布網址
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSu8Fd0IWRe8LJUGvxjUXgmw5_AlXGfdokhoEKb19cAp_mLMSWM06FKMLA0nv03DcJ0grV5VYOnTCYr/pub?output=csv";

        let myPlaces = [];
        let currentFilteredPlaces = []; // 新增這行：用來記住目前篩選出來的名單
        let currentCategory = 'all';
        let searchQuery = '';
        let currentActiveTag = null;
        let showingMap = false;
        
        const map = L.map('map', { zoomControl: false }).setView([25.04, 121.54], 12);
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap © CARTO',
            maxZoom: 19
        }).addTo(map);

        let markersGroup = L.layerGroup().addTo(map);

        function toggleMobileView() {
            showingMap = !showingMap;
            const btn = document.getElementById('mobile-toggle-btn');
            if (showingMap) {
                document.body.classList.add('show-map');
                btn.innerText = '📄 顯示列表';
                setTimeout(() => map.invalidateSize(), 300);
            } else {
                document.body.classList.remove('show-map');
                btn.innerText = '🗺️ 切換地圖';
            }
        }

        function loadData() {
            if(SHEET_CSV_URL.includes("請將你的")) {
                document.getElementById('loading').innerText = "⚠️ 錯誤：尚未填寫 Google Sheets 網址";
                return;
            }

            Papa.parse(SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    const rawData = results.data;
                    let allTagsSet = new Set();
                    
                    rawData.forEach(row => {
                        if (row.latitude && row.longitude && row.name) {
                            let rawTags = row.tags ? row.tags.split(',').map(t => t.trim()).filter(t => t !== '') : [];
                            rawTags.forEach(t => allTagsSet.add(t));

                            myPlaces.push({
                                name: row.name,
                                category: row.category ? row.category.toLowerCase().trim() : 'other',
                                area: row.area || '',
                                tags: rawTags,
                                lat: parseFloat(row.latitude),
                                lng: parseFloat(row.longitude),
                                googleMapUrl: row.url || '',
                                note: row.note || ''
                            });
                        }
                    });

                    renderTagButtons(Array.from(allTagsSet));
                    document.getElementById('loading').style.display = 'none';
                    renderMapAndList();
                },
                error: function(error) {
                    document.getElementById('loading').innerText = "讀取資料失敗，請檢查網址與網路連線。";
                    console.error("PapaParse Error:", error);
                }
            });
        }

        function renderTagButtons(tags) {
            const container = document.getElementById('tag-filters');
            container.innerHTML = ''; 
            tags.sort().forEach(tag => {
                const btn = document.createElement('button');
                btn.className = 'tag-btn';
                btn.innerText = `#${tag}`;
                btn.onclick = () => toggleTagFilter(tag, btn);
                container.appendChild(btn);
            });
        }

        function toggleTagFilter(tag, button) {
            if (currentActiveTag === tag) {
                currentActiveTag = null;
                button.classList.remove('active');
            } else {
                currentActiveTag = tag;
                document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
            }
            renderMapAndList();
        }

function renderMapAndList() {
            markersGroup.clearLayers();
            const listContainer = document.getElementById('place-list');
            listContainer.innerHTML = '';

            // 🌟 修正點：必須將結果存入「全域變數」 currentFilteredPlaces，讓地圖與抽籤功能都能同步抓到資料！
            currentFilteredPlaces = myPlaces.filter(place => {
                // 1. 判斷主分類
                const matchesCategory = currentCategory === 'all' || place.category === currentCategory;
                
                // 2. 多關鍵字搜尋邏輯
                // 先把英文 category 轉換成中文，以便搜尋
                const categoryForSearch = place.category === 'cafe' ? '咖啡廳' : (place.category === 'restaurant' ? '餐廳' : place.category);
                // 將中文分類也加入搜尋字串中
                const searchString = `${place.name} ${place.note} ${place.area} ${categoryForSearch} ${place.tags.join(' ')}`.toLowerCase();
                const keywords = searchQuery.trim().split(/\s+/).filter(k => k !== '');
                const matchesSearch = keywords.length === 0 || keywords.every(kw => searchString.includes(kw));
                
                // 3. 判斷標籤
                const matchesTag = currentActiveTag === null || place.tags.includes(currentActiveTag);
                
                return matchesCategory && matchesSearch && matchesTag;
            });

            // 這裡使用 currentFilteredPlaces 來跑迴圈，地標就會回來了
            currentFilteredPlaces.forEach(place => {
                const marker = L.marker([place.lat, place.lng]);
                const popupContent = `
                    <div class="popup-title">${place.name}</div>
                    <div style="font-size:14px; color:#666; line-height:1.5;">${place.note || place.area}</div>
                    <a href="${place.googleMapUrl}" target="_blank" class="popup-link">在 Google Maps 中開啟 ↗</a>
                `;
                marker.bindPopup(popupContent);
                markersGroup.addLayer(marker);
                
                // 把 marker 存進 place 物件中，方便抽籤時可以直接打開彈窗
                place.marker = marker;

                const card = document.createElement('div');
                card.className = 'place-card';
                
                let tagsHtml = place.tags.map(tag => `<span class="tag">#${tag}</span>`).join('');
                let categoryName = place.category === 'cafe' ? '咖啡廳' : (place.category === 'restaurant' ? '餐廳' : place.category);

                card.innerHTML = `
                    <div class="place-name">${place.name}</div>
                    <div class="place-meta">${place.area} ${place.area && categoryName && categoryName !== 'other' ? '·' : ''} ${categoryName !== 'other' ? categoryName : ''}</div>
                    ${place.note ? `<div class="place-note">${place.note}</div>` : ''}
                    <div>${tagsHtml}</div>
                `;

                card.addEventListener('click', () => {
                    if (window.innerWidth <= 768 && !showingMap) {
                        toggleMobileView();
                    }
                    map.flyTo([place.lat, place.lng], 16, { animate: true, duration: 1.2 });
                    setTimeout(() => marker.openPopup(), 400);
                });

                listContainer.appendChild(card);
            });
        }

        function filterCategory(category, button) {
            currentCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            renderMapAndList();
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderMapAndList();
        });
// 🎲 隨機抽籤功能
        function pickRandomPlace() {
            // 防呆機制：如果目前篩選條件下沒有店
            if (currentFilteredPlaces.length === 0) {
                alert("目前條件沒有找到店家喔！請換個標籤試試。");
                return;
            }

            // 1. 隨機抽取一家店
            const randomIndex = Math.floor(Math.random() * currentFilteredPlaces.length);
            const luckyPlace = currentFilteredPlaces[randomIndex];

            // 2. 如果是手機版且目前在列表畫面，自動切換到地圖
            if (window.innerWidth <= 768 && !showingMap) {
                toggleMobileView();
            }

            // 3. 畫面優雅地飛向目標定點
            map.flyTo([luckyPlace.lat, luckyPlace.lng], 16, { animate: true, duration: 1.5 });
            
            // 4. 等飛行時間結束後，打開彈窗並加上「驚喜提示」
            setTimeout(() => {
                luckyPlace.marker.setPopupContent(`
                    <div style="font-size:13px; color:#0071e3; font-weight:700; margin-bottom:6px;">🎲 今晚就決定是你了！</div>
                    <div class="popup-title">${luckyPlace.name}</div>
                    <div style="font-size:14px; color:#666; line-height:1.5;">${luckyPlace.note || luckyPlace.area}</div>
                    <a href="${luckyPlace.googleMapUrl}" target="_blank" class="popup-link">在 Google Maps 中開啟 ↗</a>
                `);
                luckyPlace.marker.openPopup();
            }, 1500);
        }
        loadData();
    </script>
</body>
</html>
