<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Personal Map Space</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f5f5f7; /* Apple 經典灰底 */
            --text-color: #1d1d1f;
            --primary-color: #000000;
            --accent-color: #86868b;
            --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            height: 100dvh; /* 動態視口高度，避免手機工具列遮擋 */
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        /* ── 平板（768px ~ 1024px）── */
        @media (max-width: 1024px) and (min-width: 769px) {
            #sidebar { width: 320px; }
        }

        /* ── 手機（≤768px）：地圖在上、抽屜在下 ── */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            #map {
                width: 100% !important;
                height: 50dvh !important;
                flex-shrink: 0;
            }

            #sidebar {
                width: 100% !important;
                height: 50dvh !important;
                border-right: none;
                border-top: 1px solid rgba(0,0,0,0.08);
                box-shadow: 0 -4px 24px rgba(0,0,0,0.06);
            }

            /* 手機頂部縮小留白 */
            .header {
                padding: 14px 16px 6px 16px;
            }

            .header h1 {
                font-size: 20px;
                margin-bottom: 10px;
            }

            /* 防止 iOS 輸入框 zoom（字體 ≥16px） */
            .search-box {
                font-size: 16px;
                padding: 10px 14px;
                margin-bottom: 10px;
            }

            /* 加大觸控目標 */
            .filter-btn {
                padding: 9px 18px;
                font-size: 14px;
                min-height: 38px;
            }

            .tag-btn {
                padding: 7px 12px;
                min-height: 34px;
            }

            /* 列表縮小內距 */
            #place-list {
                padding: 0 16px 16px 16px;
            }

            .place-card {
                padding: 16px;
                margin-bottom: 12px;
            }

            .place-name { font-size: 16px; }
        }

        /* ── 極小螢幕（≤375px）── */
        @media (max-width: 375px) {
            .header { padding: 10px 12px 4px 12px; }
            #place-list { padding: 0 12px 12px 12px; }
            .filter-btn { padding: 8px 14px; font-size: 13px; }
        }

        /* iOS 安全區域（瀏海 / Home Bar） */
        @supports (padding: env(safe-area-inset-bottom)) {
            #sidebar {
                padding-bottom: env(safe-area-inset-bottom);
            }
        }

        /* 側邊欄樣式 */
        #sidebar {
            width: 400px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 1px 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            border-right: 1px solid rgba(0,0,0,0.05);
        }

        .header {
            padding: 28px 24px 10px 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
            color: var(--text-color);
        }

        /* 搜尋與篩選器 */
        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
            background-color: #ffffff;
            transition: all 0.3s ease;
        }
        .search-box:focus { 
            border-color: #0071e3; 
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
        }

        .filter-group {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: none; /* Firefox */
        }
        .filter-group::-webkit-scrollbar { display: none; /* Chrome/Safari */ }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #d2d2d7;
            background: #ffffff;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }

        /* 動態標籤快捷列專用樣式 */
        #tag-filters {
            margin-bottom: 10px;
            padding-bottom: 8px;
        }
        
        .tag-btn {
            padding: 6px 12px;
            background: #f5f5f7;
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 13px;
            color: #495057;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tag-btn:hover { background: #e8e8ed; }
        .tag-btn.active {
            background: #0071e3; /* Apple 經典藍，凸顯選中狀態 */
            color: white;
        }

        /* 列表區域 */
        #place-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px 24px 24px;
            -webkit-overflow-scrolling: touch; /* iOS 慣性滾動 */
            overscroll-behavior: contain; /* 防止滾到底觸發頁面捲動 */
        }

        .place-card {
            background: #ffffff;
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0,0,0,0.02);
        }

        .place-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .place-name { font-size: 17px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.3px; }
        .place-meta { font-size: 13px; color: var(--accent-color); margin-bottom: 10px; font-weight: 500;}
        .place-note { font-size: 14px; color: #495057; margin-bottom: 12px; line-height: 1.5; }
        
        .tag {
            display: inline-block;
            background: #f5f5f7;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-right: 6px;
            margin-bottom: 6px;
            color: #495057;
            font-weight: 500;
        }

        /* 地圖區域 */
        #map {
            flex: 1;
            height: 100vh;
            height: 100dvh;
            min-height: 0; /* 讓 flex 子元素可縮小 */
        }

        /* Leaflet 彈出視窗客製化 */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        .popup-title { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
        .popup-link { 
            display: inline-block; 
            margin-top: 10px; 
            color: #0071e3; 
            text-decoration: none; 
            font-size: 13px; 
            font-weight: 500;
        }
        .popup-link:hover { text-decoration: underline; }

        /* 載入動畫 */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 15px;
            color: var(--accent-color);
            z-index: 2000;
            background: white;
            padding: 12px 24px;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <h1>My Map Space</h1>
            <input type="text" id="search-input" class="search-box" placeholder="搜尋店名、區域或標籤...">
            
            <div class="filter-group">
                <button class="filter-btn active" onclick="filterCategory('all', this)">全部</button>
                <button class="filter-btn" onclick="filterCategory('restaurant', this)">餐廳</button>
                <button class="filter-btn" onclick="filterCategory('cafe', this)">咖啡廳</button>
            </div>

            <div id="tag-filters" class="filter-group"></div>
        </div>
        <div id="place-list"></div>
    </div>

    <div id="map"></div>
    <div id="loading">載入最新地圖資料中...</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        // 🚨 重要：請將下方的網址替換成你自己的 Google Sheets CSV 發布網址
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSu8Fd0IWRe8LJUGvxjUXgmw5_AlXGfdokhoEKb19cAp_mLMSWM06FKMLA0nv03DcJ0grV5VYOnTCYr/pub?output=csv";

        // 全域變數
        let myPlaces = [];
        let currentCategory = 'all';
        let searchQuery = '';
        let currentActiveTag = null; // 追蹤目前選中的快捷標籤
        
        // 初始化地圖
        const map = L.map('map', { zoomControl: false }).setView([25.04, 121.54], 12);
        L.control.zoom({ position: 'topright' }).addTo(map);

        // 使用 CartoDB 的高質感淺色地圖底圖
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap © CARTO',
            maxZoom: 19
        }).addTo(map);

        let markersGroup = L.layerGroup().addTo(map);

        // 讀取 Google Sheets 資料
        function loadData() {
            if(SHEET_CSV_URL.includes("請將你的")) {
                document.getElementById('loading').innerText = "⚠️ 錯誤：尚未填寫 Google Sheets 網址";
                return;
            }

            Papa.parse(SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    const rawData = results.data;
                    let allTagsSet = new Set(); // 收集所有不重複的標籤
                    
                    rawData.forEach(row => {
                        if (row.latitude && row.longitude && row.name) {
                            
                            // 處理並收集標籤
                            let rawTags = row.tags ? row.tags.split(',').map(t => t.trim()).filter(t => t !== '') : [];
                            rawTags.forEach(t => allTagsSet.add(t));

                            myPlaces.push({
                                name: row.name,
                                category: row.category ? row.category.toLowerCase().trim() : 'other',
                                area: row.area || '',
                                tags: rawTags,
                                lat: parseFloat(row.latitude),
                                lng: parseFloat(row.longitude),
                                googleMapUrl: row.url || '',
                                note: row.note || ''
                            });
                        }
                    });

                    // 將收集到的標籤生成按鈕
                    renderTagButtons(Array.from(allTagsSet));

                    document.getElementById('loading').style.display = 'none';
                    renderMapAndList();
                },
                error: function(error) {
                    document.getElementById('loading').innerText = "讀取資料失敗，請檢查網址與網路連線。";
                    console.error("PapaParse Error:", error);
                }
            });
        }

        // 渲染上方滑動標籤按鈕
        function renderTagButtons(tags) {
            const container = document.getElementById('tag-filters');
            container.innerHTML = ''; 
            
            // 照字母或筆畫排序，讓版面看起來更有條理
            tags.sort().forEach(tag => {
                const btn = document.createElement('button');
                btn.className = 'tag-btn';
                btn.innerText = `#${tag}`;
                btn.onclick = () => toggleTagFilter(tag, btn);
                container.appendChild(btn);
            });
        }

        // 點擊標籤的切換邏輯
        function toggleTagFilter(tag, button) {
            if (currentActiveTag === tag) {
                // 取消選中
                currentActiveTag = null;
                button.classList.remove('active');
            } else {
                // 選中新標籤
                currentActiveTag = tag;
                document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
            }
            renderMapAndList();
        }

        // 渲染地圖標記與左側卡片
        function renderMapAndList() {
            markersGroup.clearLayers();
            const listContainer = document.getElementById('place-list');
            listContainer.innerHTML = '';

            // 綜合篩選邏輯：主分類 + 搜尋框 + 點擊的標籤
            const filteredPlaces = myPlaces.filter(place => {
                const matchesCategory = currentCategory === 'all' || place.category === currentCategory;
                const searchString = `${place.name} ${place.note} ${place.area} ${place.tags.join(' ')}`.toLowerCase();
                const matchesSearch = searchString.includes(searchQuery);
                const matchesTag = currentActiveTag === null || place.tags.includes(currentActiveTag);
                
                return matchesCategory && matchesSearch && matchesTag;
            });

            filteredPlaces.forEach(place => {
                // 地圖標記
                const marker = L.marker([place.lat, place.lng]);
                const popupContent = `
                    <div class="popup-title">${place.name}</div>
                    <div style="font-size:13px; color:#666; line-height:1.4;">${place.note || place.area}</div>
                    <a href="${place.googleMapUrl}" target="_blank" class="popup-link">在 Google Maps 中開啟 ↗</a>
                `;
                marker.bindPopup(popupContent);
                markersGroup.addLayer(marker);

                // 左側卡片
                const card = document.createElement('div');
                card.className = 'place-card';
                
                let tagsHtml = place.tags.map(tag => `<span class="tag">#${tag}</span>`).join('');
                
                let categoryName = place.category;
                if(place.category === 'cafe') categoryName = '咖啡廳';
                if(place.category === 'restaurant') categoryName = '餐廳';

                card.innerHTML = `
                    <div class="place-name">${place.name}</div>
                    <div class="place-meta">${place.area} ${place.area && categoryName ? '·' : ''} ${categoryName !== 'other' ? categoryName : ''}</div>
                    ${place.note ? `<div class="place-note">${place.note}</div>` : ''}
                    <div>${tagsHtml}</div>
                `;

                card.addEventListener('click', () => {
                    map.flyTo([place.lat, place.lng], 16, { animate: true, duration: 1.2 });
                    marker.openPopup();
                });

                listContainer.appendChild(card);
            });
        }

        // 主分類按鈕事件
        function filterCategory(category, button) {
            currentCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            renderMapAndList();
        }

        // 搜尋欄事件
        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderMapAndList();
        });

        // 啟動資料載入
        loadData();
    </script>
</body>
</html>
