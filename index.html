<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Personal Map Space</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f5f5f7;
            --text-color: #1d1d1f;
            --primary-color: #000000;
            --accent-color: #86868b;
            --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent; /* 移除手機點擊的預設藍色閃爍 */
        }

        body {
            display: flex;
            height: 100vh;
            height: 100dvh; /* 適應手機瀏覽器的動態網址列高度 */
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            position: relative;
        }

        /* 側邊欄樣式 (桌機版) */
        #sidebar {
            width: 400px;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 1px 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            border-right: 1px solid rgba(0,0,0,0.05);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
        }

        .header {
            padding: 28px 24px 10px 24px;
            background: inherit;
            z-index: 10;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
        }

        /* 搜尋與篩選器 */
        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
            background-color: #ffffff;
            transition: all 0.3s ease;
            appearance: none; /* 移除 iOS 預設樣式 */
        }
        .search-box:focus { 
            border-color: #0071e3; 
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
        }

        .filter-group {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: none;
        }
        .filter-group::-webkit-scrollbar { display: none; }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #d2d2d7;
            background: #ffffff;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }

        #tag-filters { margin-bottom: 10px; padding-bottom: 8px; }
        .tag-btn {
            padding: 6px 12px;
            background: #f5f5f7;
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 13px;
            color: #495057;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .tag-btn:hover { background: #e8e8ed; }
        .tag-btn.active { background: #0071e3; color: white; }

        /* 列表區域 */
        #place-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px 24px 24px;
            -webkit-overflow-scrolling: touch; /* iOS 順滑滾動 */
        }

        .place-card {
            background: #ffffff;
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0,0,0,0.02);
        }
        .place-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .place-card:active { transform: scale(0.98); }

        .place-name { font-size: 17px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.3px; }
        .place-meta { font-size: 13px; color: var(--accent-color); margin-bottom: 10px; font-weight: 500;}
        .place-note { font-size: 14px; color: #495057; margin-bottom: 12px; line-height: 1.5; }
        
        .tag {
            display: inline-block;
            background: #f5f5f7;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-right: 6px;
            margin-bottom: 6px;
            color: #495057;
            font-weight: 500;
        }

        /* 地圖區域 */
        #map { flex: 1; height: 100%; z-index: 500; }

        .leaflet-popup-content-wrapper { border-radius: 12px; padding: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        .popup-title { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
        .popup-link { display: inline-block; margin-top: 10px; color: #0071e3; text-decoration: none; font-size: 13px; font-weight: 500; }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 15px; color: var(--accent-color); z-index: 2000;
            background: white; padding: 12px 24px; border-radius: 20px; box-shadow: var(--card-shadow);
        }

        /* 📱 RWD 手機版核心設定 */
        .mobile-toggle { display: none; }

        @media (max-width: 768px) {
            body { display: block; }
            
            #sidebar {
                position: absolute;
                top: 0; left: 0;
                width: 100% !important;
                height: 100%;
                background: #f5f5f7;
            }

            /* 手機版列表底部留白，避免被懸浮按鈕擋住 */
            #place-list { padding-bottom: 100px; }

            #map {
                position: absolute;
                top: 0; left: 0;
                width: 100% !important;
                height: 100%;
            }

            /* 當切換到地圖模式時，將側邊欄隱藏並滑出畫面 */
            body.show-map #sidebar {
                transform: translateY(100%);
                opacity: 0;
                pointer-events: none;
            }

            /* 手機專屬：懸浮切換按鈕 */
            .mobile-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
                position: fixed;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 2000;
                background: rgba(29, 29, 31, 0.9);
                backdrop-filter: blur(10px);
                color: white;
                border: none;
                padding: 14px 28px;
                border-radius: 30px;
                font-size: 15px;
                font-weight: 600;
                box-shadow: 0 8px 24px rgba(0,0,0,0.2);
                cursor: pointer;
                transition: transform 0.2s ease, background 0.3s ease;
            }
            .mobile-toggle:active { transform: translateX(-50%) scale(0.95); }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <h1>My Map Space</h1>
            <input type="text" id="search-input" class="search-box" placeholder="搜尋店名、區域或標籤...">
            <div class="filter-group">
                <button class="filter-btn active" onclick="filterCategory('all', this)">全部</button>
                <button class="filter-btn" onclick="filterCategory('restaurant', this)">餐廳</button>
                <button class="filter-btn" onclick="filterCategory('cafe', this)">咖啡廳</button>
            </div>
            <div id="tag-filters" class="filter-group"></div>
        </div>
        <div id="place-list"></div>
    </div>

    <div id="map"></div>
    <div id="loading">載入最新地圖資料中...</div>

    <button id="mobile-toggle-btn" class="mobile-toggle" onclick="toggleMobileView()">🗺️ 切換地圖</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        // 🚨 重要：請將下方的網址替換成你自己的 Google Sheets CSV 發布網址
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSu8Fd0IWRe8LJUGvxjUXgmw5_AlXGfdokhoEKb19cAp_mLMSWM06FKMLA0nv03DcJ0grV5VYOnTCYr/pub?output=csv";

        let myPlaces = [];
        let currentCategory = 'all';
        let searchQuery = '';
        let currentActiveTag = null;
        let showingMap = false; // 追蹤手機版目前的視角模式
        
        const map = L.map('map', { zoomControl: false }).setView([25.04, 121.54], 12);
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap © CARTO',
            maxZoom: 19
        }).addTo(map);

        let markersGroup = L.layerGroup().addTo(map);

        // 手機版切換視圖功能
        function toggleMobileView() {
            showingMap = !showingMap;
            const btn = document.getElementById('mobile-toggle-btn');
            if (showingMap) {
                document.body.classList.add('show-map');
                btn.innerText = '📄 顯示列表';
                setTimeout(() => map.invalidateSize(), 300); // 確保地圖尺寸重新計算
            } else {
                document.body.classList.remove('show-map');
                btn.innerText = '🗺️ 切換地圖';
            }
        }

        function loadData() {
            if(SHEET_CSV_URL.includes("請將你的")) {
                document.getElementById('loading').innerText = "⚠️ 錯誤：尚未填寫 Google Sheets 網址";
                return;
            }

            Papa.parse(SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    const rawData = results.data;
                    let allTagsSet = new Set();
                    
                    rawData.forEach(row => {
                        if (row.latitude && row.longitude && row.name) {
                            let rawTags = row.tags ? row.tags.split(',').map(t => t.trim()).filter(t => t !== '') : [];
                            rawTags.forEach(t => allTagsSet.add(t));

                            myPlaces.push({
                                name: row.name,
                                category: row.category ? row.category.toLowerCase().trim() : 'other',
                                area: row.area || '',
                                tags: rawTags,
                                lat: parseFloat(row.latitude),
                                lng: parseFloat(row.longitude),
                                googleMapUrl: row.url || '',
                                note: row.note || ''
                            });
                        }
                    });

                    renderTagButtons(Array.from(allTagsSet));
                    document.getElementById('loading').style.display = 'none';
                    renderMapAndList();
                },
                error: function(error) {
                    document.getElementById('loading').innerText = "讀取資料失敗，請檢查網址與網路連線。";
                    console.error("PapaParse Error:", error);
                }
            });
        }

        function renderTagButtons(tags) {
            const container = document.getElementById('tag-filters');
            container.innerHTML = ''; 
            tags.sort().forEach(tag => {
                const btn = document.createElement('button');
                btn.className = 'tag-btn';
                btn.innerText = `#${tag}`;
                btn.onclick = () => toggleTagFilter(tag, btn);
                container.appendChild(btn);
            });
        }

        function toggleTagFilter(tag, button) {
            if (currentActiveTag === tag) {
                currentActiveTag = null;
                button.classList.remove('active');
            } else {
                currentActiveTag = tag;
                document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
            }
            renderMapAndList();
        }

        function renderMapAndList() {
            markersGroup.clearLayers();
            const listContainer = document.getElementById('place-list');
            listContainer.innerHTML = '';

            const filteredPlaces = myPlaces.filter(place => {
                const matchesCategory = currentCategory === 'all' || place.category === currentCategory;
                const searchString = `${place.name} ${place.note} ${place.area} ${place.tags.join(' ')}`.toLowerCase();
                const matchesSearch = searchString.includes(searchQuery);
                const matchesTag = currentActiveTag === null || place.tags.includes(currentActiveTag);
                return matchesCategory && matchesSearch && matchesTag;
            });

            filteredPlaces.forEach(place => {
                const marker = L.marker([place.lat, place.lng]);
                const popupContent = `
                    <div class="popup-title">${place.name}</div>
                    <div style="font-size:13px; color:#666; line-height:1.4;">${place.note || place.area}</div>
                    <a href="${place.googleMapUrl}" target="_blank" class="popup-link">在 Google Maps 中開啟 ↗</a>
                `;
                marker.bindPopup(popupContent);
                markersGroup.addLayer(marker);

                const card = document.createElement('div');
                card.className = 'place-card';
                
                let tagsHtml = place.tags.map(tag => `<span class="tag">#${tag}</span>`).join('');
                let categoryName = place.category === 'cafe' ? '咖啡廳' : (place.category === 'restaurant' ? '餐廳' : place.category);

                card.innerHTML = `
                    <div class="place-name">${place.name}</div>
                    <div class="place-meta">${place.area} ${place.area && categoryName && categoryName !== 'other' ? '·' : ''} ${categoryName !== 'other' ? categoryName : ''}</div>
                    ${place.note ? `<div class="place-note">${place.note}</div>` : ''}
                    <div>${tagsHtml}</div>
                `;

                // 🌟 RWD 核心體驗：點擊卡片自動切換為地圖，並飛向定點
                card.addEventListener('click', () => {
                    // 如果是手機版尺寸，自動收起列表切換到地圖
                    if (window.innerWidth <= 768 && !showingMap) {
                        toggleMobileView();
                    }
                    map.flyTo([place.lat, place.lng], 16, { animate: true, duration: 1.2 });
                    
                    // 稍微延遲打開彈窗，確保地圖已經飛到定位
                    setTimeout(() => marker.openPopup(), 400);
                });

                listContainer.appendChild(card);
            });
        }

        function filterCategory(category, button) {
            currentCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            renderMapAndList();
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderMapAndList();
        });

        loadData();
    </script>
</body>
</html>
